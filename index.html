<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><title>Bangkok Break Fail</title>
<style>*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#171331;color:white;font-family:system-ui,sans-serif;touch-action:none}canvas{width:100vw;height:100dvh;display:block}#hud{position:fixed;top:env(safe-area-inset-top);left:0;right:0;display:flex;justify-content:space-between;padding:18px;font-weight:900;text-shadow:0 2px 4px #000;pointer-events:none}#score{font-size:25px}#overlay{position:fixed;inset:0;background:#171331ce;display:grid;place-items:center;padding:20px}#panel{background:#29204e;border:3px solid #ffe15a;border-radius:22px;text-align:center;padding:26px 16px;max-width:390px;width:100%}h1{color:#ffe15a;text-shadow:3px 3px #ec5374;line-height:1.08;font-size:35px}button{background:#ffe15a;border:0;border-radius:14px;padding:16px 28px;font-size:20px;font-weight:900}small{display:block;margin-top:16px;color:#d9d2f3}#hint{position:fixed;bottom:calc(18px + env(safe-area-inset-bottom));width:100%;text-align:center;font-weight:bold;text-shadow:0 2px 5px #000;pointer-events:none}</style></head>
<body><canvas id="c"></canvas><div id="hud"><span id="score">0 pts</span><span id="speed">60 km/h</span></div><div id="hint"></div><div id="overlay"><div id="panel"><h1>🛺 BANGKOK<br>BREAK FAIL!</h1><p>NO BRAKES. NO RULES.<br>JUST BANGKOK.</p><p>เอียงมือถือเพื่อหลบทุเรียนยักษ์<br>Tilt your phone to steer!</p><button id="start">START CHAOS</button><small>Hold the phone naturally when starting: it calibrates your tilt.<br>Drag left/right as a fallback. 3 lives · near-miss combos!</small></div></div>
<script>
(()=>{'use strict';const c=document.getElementById('c'),g=c.getContext('2d'),overlay=document.getElementById('overlay'),panel=document.getElementById('panel'),score=document.getElementById('score'),speed=document.getElementById('speed'),hint=document.getElementById('hint');let w,h,dpr,playing=false,meters=0,v=60,x=0,steer=0,motion=false,drag=null,spawn=0,objects=[],scroll=0,flash=0,inv=0,crashes=0,last=0,combo=0,bonus=0,neutral=null,filtered=0,calibration=0,mode='tilt',high=0,nearMisses=0,shake=0;try{high=Number(localStorage.getItem('bbf-best')||0)}catch(e){}
function resize(){w=innerWidth;h=innerHeight;dpr=Math.min(devicePixelRatio||1,2);c.width=w*dpr;c.height=h*dpr;g.setTransform(dpr,0,0,dpr,0,0)}addEventListener('resize',resize);resize();
function box(x,y,w,h,color){g.fillStyle=color;g.fillRect(x,y,w,h)}function circle(x,y,r,color){g.fillStyle=color;g.beginPath();g.arc(x,y,r,0,Math.PI*2);g.fill()}function poly(points,color){g.fillStyle=color;g.beginPath();g.moveTo(...points[0]);for(let i=1;i<points.length;i++)g.lineTo(...points[i]);g.closePath();g.fill()}function proj(z){const t=1-z;return {y:h*.37+t*t*h*.70,half:w*(.09+t*.44),s:.15+t*1.3}}function wx(l,z){return w/2+l*proj(z).half*.85}
function scene(){box(0,0,w,h,'#78d6f4');circle(w*.78,h*.13,37,'#ffea91');box(0,h*.34,w,h,'#70b96b');for(let i=0;i<12;i++){const xx=i*w/10-30,hh=h*(.08+(i%4)*.026);box(xx,h*.37-hh,w*.085,hh,'#b994d1');box(xx+6,h*.37-hh+12,w*.04,5,'#ffe18b')}poly([[w*.45,h*.37],[w*.55,h*.37],[w*1.1,h],[w*-.1,h]],'#55566a');poly([[w*.47,h*.37],[w*.53,h*.37],[w*.91,h],[w*.09,h]],'#686b7f');for(let i=0;i<12;i++){const z=(i/12+scroll)%1,p=proj(z);box(w/2-3*p.s,p.y,6*p.s,25*p.s,'#ffdf68');circle(w/2-p.half,p.y,3*p.s,'#ff7b94');circle(w/2+p.half,p.y,3*p.s,'#ff7b94')}}
function durian(o){const p=proj(o.z),xx=wx(o.l,o.z),r=25*p.s;if(p.y>h+100)return;g.save();g.translate(xx,p.y-r);g.rotate(o.spin);circle(0,0,r,'#9baf30');for(let a=0;a<Math.PI*2;a+=.35){const sx=Math.cos(a),sy=Math.sin(a);poly([[sx*r*.85,sy*r*.85],[sx*r*1.35-sy*5*p.s,sy*r*1.35+sx*5*p.s],[sx*r*1.35+sy*5*p.s,sy*r*1.35-sx*5*p.s]],'#e8d66c')}circle(-r*.25,-r*.2,r*.15,'#d6c94c');g.restore()}
function tuk(){const yy=h*.79,xx=w/2+x*w*.35,s=Math.min(w/390,1.25);g.save();g.translate(xx,yy);g.rotate(Math.sin(performance.now()*.009)*.025+steer*.08+(flash>0?Math.sin(performance.now()*.03)*.22:0));g.scale(s,s);g.fillStyle='#242032';g.beginPath();g.ellipse(0,36,68,20,0,0,Math.PI*2);g.fill();box(-59,6,20,37,'#1a1826');box(39,6,20,37,'#1a1826');poly([[-53,-22],[53,-22],[60,26],[-60,26]],'#14b6c3');poly([[-47,-65],[47,-65],[54,-20],[-54,-20]],'#f3d340');poly([[-40,-59],[40,-59],[44,-27],[-44,-27]],'#252344');poly([[-60,-69],[60,-69],[49,-86],[-49,-86]],'#f15d76');box(-45,21,90,9,'#ffdc56');circle(-42,10,9,'#fff0a6');circle(42,10,9,'#fff0a6');box(-21,6,42,15,'#e34b67');g.restore()}
function reset(){playing=true;meters=0;v=60;x=0;steer=0;filtered=0;neutral=null;spawn=.8;objects=[];scroll=0;flash=0;inv=0;crashes=0;combo=0;bonus=0;nearMisses=0;drag=null;overlay.style.display='none';hint.textContent='TILT OR DRAG TO STEER'}
function end(){playing=false;const total=Math.floor(meters+bonus);if(total>high){high=total;try{localStorage.setItem('bbf-best',String(high))}catch(e){}}panel.innerHTML='<h1>💥 GAME OVER!</h1><p>SCORE <b>'+total+'</b> · BEST '+high+'</p><p>Near misses: '+nearMisses+' · Crashes: '+crashes+'</p><button id="again">TRY AGAIN</button><small>Lean to steer · Drag as fallback</small>';overlay.style.display='grid';document.getElementById('again').onclick=reset}
function update(dt){if(!playing)return;v=Math.min(190,v+dt*3.1);meters+=dt*v/3.6;scroll=(scroll+dt*v/150)%1;const target=drag!==null?drag:(motion?steer:0);filtered+=(target-filtered)*Math.min(1,dt*9);if(Math.abs(filtered)<.045)filtered=0;x=Math.max(-1,Math.min(1,x+filtered*dt*1.9));spawn-=dt;if(spawn<=0){const lane=Math.floor(Math.random()*3)-1;objects.push({l:lane*.72+(Math.random()-.5)*.14,z:1,spin:0,hit:false,passed:false});spawn=Math.max(.62,1.55-v/230)}for(const o of objects){o.z-=dt*v/150;o.spin+=dt*1.4;if(o.z<.14&&o.z>-.06&&!o.hit&&Math.abs(o.l-x)<.34&&inv<=0){o.hit=true;crashes++;combo=0;flash=.65;inv=1.45;v=Math.max(50,v*.68);x=Math.max(-1,Math.min(1,x+(x<o.l?-.3:.3)));hint.textContent='💥 DURIAN ATTACK!';if(navigator.vibrate)navigator.vibrate(90);if(crashes>=3){end();break}}if(!o.passed&&o.z<-.08){o.passed=true;if(!o.hit&&Math.abs(o.l-x)<.57){nearMisses++;combo=Math.min(combo+1,5);bonus+=25*combo;hint.textContent='🔥 NEAR MISS +'+25*combo}}}objects=objects.filter(o=>o.z>-.3);flash=Math.max(0,flash-dt);inv=Math.max(0,inv-dt);score.textContent=Math.floor(meters+bonus)+' pts';speed.textContent=Math.floor(v)+' km/h · ❤️ '+(3-crashes);if(flash<=0&&hint.textContent.startsWith('💥'))hint.textContent='KEEP GOING!'}

function draw(){scene();objects.slice().sort((a,b)=>b.z-a.z).forEach(durian);if(!(inv>0&&Math.floor(performance.now()/110)%2))tuk();if(flash>0){g.fillStyle='rgba(255,80,60,'+(flash*.2)+')';g.fillRect(0,0,w,h)}}
function loop(now){const dt=Math.min((now-last)/1000||0,.04);last=now;update(dt);draw();requestAnimationFrame(loop)}requestAnimationFrame(loop);
addEventListener('deviceorientation',e=>{if(typeof e.gamma==='number'&&Number.isFinite(e.gamma)){motion=true;if(neutral===null)neutral=e.gamma;const angle=((e.gamma-neutral+180)%360+360)%360-180;steer=Math.max(-1,Math.min(1,angle/24))}});
c.addEventListener('pointerdown',e=>{drag=Math.max(-1,Math.min(1,(e.clientX/w-.5)*2.4));c.setPointerCapture(e.pointerId)});c.addEventListener('pointermove',e=>{if(drag!==null)drag=Math.max(-1,Math.min(1,(e.clientX/w-.5)*2.4))});c.addEventListener('pointerup',()=>drag=null);c.addEventListener('pointercancel',()=>drag=null);
document.getElementById('start').onclick=async()=>{try{if(window.DeviceOrientationEvent&&typeof DeviceOrientationEvent.requestPermission==='function'){await DeviceOrientationEvent.requestPermission()}}catch(e){}reset()};
})();
</script></body></html>
