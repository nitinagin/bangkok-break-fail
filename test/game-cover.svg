<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1800" viewBox="0 0 900 1800" role="img" aria-label="Nitinagin's Break Fail, Light Out Night Thailand, neon Bangkok tuk-tuk chase">
<defs>
<linearGradient id="sky" x2="0" y2="1"><stop stop-color="#050914"/><stop offset=".48" stop-color="#161128"/><stop offset=".8" stop-color="#250f20"/><stop offset="1" stop-color="#060912"/></linearGradient>
<linearGradient id="red" x2="1" y2=".2"><stop stop-color="#ff2c36"/><stop offset=".55" stop-color="#df0716"/><stop offset="1" stop-color="#9b0012"/></linearGradient>
<linearGradient id="gold" x2="1" y2=".5"><stop stop-color="#fff5a0"/><stop offset=".55" stop-color="#ffce25"/><stop offset="1" stop-color="#f38a16"/></linearGradient>
<linearGradient id="fog" x2="0" y2="1"><stop stop-color="#090c18" stop-opacity=".03"/><stop offset=".5" stop-color="#050814" stop-opacity=".06"/><stop offset="1" stop-color="#04050d" stop-opacity=".9"/></linearGradient>
<radialGradient id="redGlow"><stop stop-color="#ed1935" stop-opacity=".55"/><stop offset="1" stop-color="#c20a33" stop-opacity="0"/></radialGradient>
<radialGradient id="blueGlow"><stop stop-color="#2e90e9" stop-opacity=".5"/><stop offset="1" stop-color="#076ad7" stop-opacity="0"/></radialGradient>
<linearGradient id="road" x2="0" y2="1"><stop stop-color="#0b0c18" stop-opacity="0"/><stop offset="1" stop-color="#080b13" stop-opacity=".96"/></linearGradient>
<filter id="shadow" x="-25%" y="-30%" width="150%" height="175%"><feDropShadow dx="5" dy="9" stdDeviation="6" flood-color="#000" flood-opacity=".9"/></filter>
<filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="13"/></filter>
<clipPath id="scene"><rect x="0" y="665" width="900" height="1135"/></clipPath>
</defs>
<rect width="900" height="1800" fill="url(#sky)"/>
<ellipse cx="115" cy="560" rx="490" ry="450" fill="url(#redGlow)"/>
<ellipse cx="850" cy="760" rx="430" ry="580" fill="url(#blueGlow)"/>
<!-- Original tiny photo retained only as atmospheric scenery, not as title lettering. -->
<g clip-path="url(#scene)">
 <svg x="-80" y="650" width="1060" height="1110" viewBox="0 49 180 71" preserveAspectRatio="xMidYMid slice"><image width="180" height="120" href="data:image/jpeg;base64,"/></svg>
 <rect x="0" y="665" width="900" height="1135" fill="url(#fog)"/>
</g>
<g opacity=".9">
 <path d="M0 670V570h40v-92h45v90h40V440h62v112h43v-92h50v110h46v-126h56v130h60v-96h46v93h55v-145h61v143h44V468h65v108h53V425h52v150h50V485h55v130h55v55Z" fill="#060b16" opacity=".75"/>
 <g stroke="#ff245b" stroke-width="7" opacity=".7"><path d="M55 612v-130M166 600v-130M742 594v-134"/></g>
 <g stroke="#3bbfff" stroke-width="6" opacity=".65"><path d="M320 612v-122M602 604v-120M842 610v-128"/></g>
</g>
<g font-family="Arial,sans-serif" font-weight="900" text-anchor="middle">
 <rect x="32" y="735" width="245" height="74" rx="9" fill="#600016" stroke="#ff4765" stroke-width="5"/>
 <text x="155" y="784" font-size="44" fill="#ffeaa2">เยาวราช</text>
 <rect x="639" y="842" width="230" height="70" rx="8" fill="#003e52" stroke="#45d9ff" stroke-width="5"/>
 <text x="753" y="890" font-size="39" fill="#fff2bf">พระราม 2</text>
</g>
<g stroke-linecap="round" opacity=".7">
 <path d="M60 1290L275 1790" stroke="#ff1b4c" stroke-width="8" filter="url(#glow)"/>
 <path d="M836 1240L660 1790" stroke="#32b5ff" stroke-width="10" filter="url(#glow)"/>
 <path d="M115 1460L310 1790" stroke="#ffb51f" stroke-width="5"/>
 <path d="M780 1440L670 1790" stroke="#fc2762" stroke-width="6"/>
</g>
<g text-anchor="middle" font-family="Impact,Arial Black,Arial,sans-serif" font-weight="900" filter="url(#shadow)">
 <text x="450" y="170" font-size="92" font-style="italic" fill="#fff" letter-spacing="-4">NITINAGIN’S</text>
 <text x="450" y="350" font-size="185" font-style="italic" fill="url(#red)" stroke="#50010e" stroke-width="3" letter-spacing="-8">BREAK</text>
 <text x="450" y="520" font-size="198" font-style="italic" fill="url(#gold)" stroke="#66310b" stroke-width="3" letter-spacing="-9">FAIL!</text>
</g>
<g text-anchor="middle" font-family="Arial,sans-serif" font-weight="900">
 <text x="450" y="590" font-size="48" fill="#e8f3ff" letter-spacing="2">LIGHT OUT NIGHT : THAILAND</text>
 <text x="450" y="638" font-size="30" fill="#ffdd7b" letter-spacing="5">NO BRAKES. NO RULES.</text>
</g>
<rect x="0" y="1480" width="900" height="320" fill="url(#road)"/>
</svg>